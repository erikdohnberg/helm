<!DOCTYPE html><html><head><meta charset="utf-8"><title>Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
main{max-width:var(--measure-page);margin:0 auto;padding:48px 40px 96px;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
.rail{border-right:1px solid var(--border)}
.body{min-width:0;padding-left:var(--rail-indent)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
@keyframes helm-shimmer{0%{background-position:-220px 0}100%{background-position:220px 0}}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="QuarterScreen.jsx"></script>
<script type="text/babel" src="OutcomeScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" data-presets="react">
const AP = window.HelmDesignSystem_ea1bb8;
const { TopNav, Modal, Button, Textarea, RadioOption, Toast, ToastViewport, Icon } = AP;

function App() {
  const [path, setPath] = React.useState("/quarter");
  const [drift, setDrift] = React.useState(true);
  const [replaceOpen, setReplaceOpen] = React.useState(false);
  const [mode, setMode] = React.useState("");
  const [outcomes, setOutcomes] = React.useState(window.HELM_OUTCOMES);
  const [toasts, setToasts] = React.useState([]);

  function toast(message, tone) {
    const id = Date.now();
    setToasts((t) => t.concat([{ id, message, tone }]));
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4000);
  }

  function record() {
    if (mode === "replace") {
      setOutcomes((list) => list.map((o) => (o.id === "o1" ? Object.assign({}, o, { state: "replaced", reasons: ["Traded for the unentered work started 21 Feb."] }) : o)));
      toast("Recorded. The co-sell motion stands replaced and stays in the record.");
    } else {
      toast("Recorded. Nothing entered the quarter.");
    }
    setDrift(false);
    setReplaceOpen(false);
    setMode("");
  }

  return (
    <div>
      <TopNav
        active={path}
        onNavigate={setPath}
        logoSrc="../../assets/helm-logo.svg"
        items={[{ id: "/quarter", label: "Quarter" }, { id: "/outcome", label: "Outcomes" }, { id: "/settings", label: "Settings" }]}
        trailing={<span style={{ fontFamily: "var(--font-mono)", fontSize: "10.5px", letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--brass-soft)" }}>Acme Inc.</span>}
      />
      <main>
        <div className="rail"></div>
        <div className="body">
          {path === "/quarter" ? (
            <QuarterScreen outcomes={outcomes} drift={drift} onResolveDrift={() => { setDrift(false); toast("Dismissed. Nothing changed in the record."); }} onOpenReplace={() => setReplaceOpen(true)} />
          ) : null}
          {path === "/outcome" ? <OutcomeScreen outcome={window.HELM_OUTCOMES[0]} /> : null}
          {path === "/settings" ? <SettingsScreen onToast={toast} /> : null}
        </div>
      </main>

      {replaceOpen ? (
        <Modal
          title="What stops if this enters?"
          description="Four engineers are on work this quarter never anchored. Recording it means saying what it displaces."
          onClose={() => setReplaceOpen(false)}
          footer={<>
            <Button variant="outline" size="sm" onClick={() => setReplaceOpen(false)}>Cancel</Button>
            <Button size="sm" disabled={!mode} onClick={record}>Record this decision</Button>
          </>}
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <RadioOption name="entry" value="replace" checked={mode === "replace"} onChange={() => setMode("replace")}
              hint="The co-sell motion stops and stays in the record with its reasoning.">Replace the co-sell motion</RadioOption>
            <RadioOption name="entry" value="attach" checked={mode === "attach"} onChange={() => setMode("attach")}
              hint="Nothing stops. The work joins an outcome that already stands.">Attach it to an existing outcome</RadioOption>
            <Textarea id="why" label="Reasoning" rows={2} placeholder="What changed since 14 Jan?" />
          </div>
        </Modal>
      ) : null}

      <ToastViewport>{toasts.map((t) => <Toast key={t.id} message={t.message} tone={t.tone} />)}</ToastViewport>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
