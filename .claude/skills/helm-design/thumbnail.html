<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px}
.mark{background:var(--navy);display:flex;align-items:center;justify-content:center}
.mark img{width:52%;height:auto;object-fit:contain;filter:brightness(0) invert(1)}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
a{color:var(--navy)}a:hover{color:var(--sea)}</style>
</head><body>
<div class="mark"><img src="assets/helm-logo.svg" alt="Helm"></div>
<div class="strip">
<div style="background:var(--brass-soft)"></div>
<div style="background:var(--brass)"></div>
<div style="background:var(--sea)"></div>
<div style="background:var(--navy-deep)"></div>
</div>
</body></html>
