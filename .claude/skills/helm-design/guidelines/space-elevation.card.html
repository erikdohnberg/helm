<!-- @dsCard group="Space" viewport="700x170" name="Elevation, with stated intent" subtitle="Four levels; a surface may not borrow another's shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:22px;height:170px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;background:var(--background)}.c{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-log);padding:16px;display:flex;flex-direction:column;gap:6px}.n{font-family:var(--font-mono);font-size:12px;color:var(--subtle-foreground)}.t{font-weight:600;font-size:13.5px}.d{font-size:12.5px;color:var(--muted-foreground)}</style></head><body>
<div class="c"><div class="n">e0 · flat</div><div class="t">Part of the record</div><div class="d">Border only. Charters, tables, timeline. Nothing in the record floats.</div></div>
<div class="c" style="box-shadow:var(--e1)"><div class="n">e1 · raised</div><div class="t">Actionable object</div><div class="d">A card you can pick up.</div></div>
<div class="c" style="box-shadow:var(--e2)"><div class="n">e2 · floating</div><div class="t">Transient</div><div class="d">Dropdowns, popovers, toasts. Leaves no trace.</div></div>
<div class="c" style="box-shadow:var(--e3)"><div class="n">e3 · modal</div><div class="t">Requires a decision</div><div class="d">Dialogs only, always with a scrim.</div></div>
</body></html>
