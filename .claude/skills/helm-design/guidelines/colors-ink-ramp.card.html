<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{display:grid;grid-template-columns:repeat(12,1fr);height:140px}div{display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10px}</style></head><body>
<div style="background:var(--ink-025);color:var(--subtle-foreground)">025</div>
<div style="background:var(--ink-050);color:var(--subtle-foreground)">050</div>
<div style="background:var(--ink-100);color:var(--subtle-foreground)">100</div>
<div style="background:var(--ink-200);color:var(--subtle-foreground)">200</div>
<div style="background:var(--ink-300);color:var(--muted-foreground)">300</div>
<div style="background:var(--ink-400);color:var(--muted-foreground)">400</div>
<div style="background:var(--ink-500);color:var(--ink-025)">500</div>
<div style="background:var(--ink-600);color:var(--ink-025)">600</div>
<div style="background:var(--ink-700);color:var(--ink-025)">700</div>
<div style="background:var(--ink-800);color:var(--ink-025)">800</div>
<div style="background:var(--ink-900);color:var(--ink-025)">900</div>
<div style="background:var(--ink-950);color:var(--ink-025)">950</div>
</body></html>
