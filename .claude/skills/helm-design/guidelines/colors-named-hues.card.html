<!-- @dsCard group="Colors" viewport="700x150" name="Named hues" subtitle="Three hues, one job each, plus one red for irreversible loss" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:20px;height:150px;box-sizing:border-box;display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;align-content:center}.s{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:var(--radius-log);padding:10px 14px}.sw{width:26px;height:26px;border-radius:4px;flex:none}.n{font-size:13px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;color:var(--subtle-foreground)}</style></head><body>
<div class="s"><span class="sw" style="background:var(--navy)"></span><div><div class="n">Navy · ink, structure, primary</div><div class="v">oklch(0.235 0.044 245)</div></div></div>
<div class="s"><span class="sw" style="background:var(--brass)"></span><div><div class="n">Brass · drift only</div><div class="v">oklch(0.615 0.100 68)</div></div></div>
<div class="s"><span class="sw" style="background:var(--sea)"></span><div><div class="n">Verdigris · observed by Helm</div><div class="v">oklch(0.505 0.070 195)</div></div></div>
<div class="s"><span class="sw" style="background:var(--destructive)"></span><div><div class="n">Red · irreversible destruction only</div><div class="v">oklch(0.520 0.140 25)</div></div></div>
</body></html>
