<!-- @dsCard group="Type" viewport="700x210" name="System sans — the machinery" subtitle="15px base at 1.6; editorial, not dense" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:24px;height:210px;box-sizing:border-box}.r{display:grid;grid-template-columns:1fr 200px;align-items:baseline;gap:16px;padding:7px 0;border-top:1px solid var(--border)}.t{font-family:var(--font-mono);font-size:11.5px;color:var(--subtle-foreground)}</style></head><body>
<div class="r" style="border-top:none"><div style="font-size:17px;font-weight:600">Section heading</div><div class="t">sans · 17/1.5 · 600</div></div>
<div class="r"><div style="font-size:15px">Body — long-form reasoning lives here and wraps at 68ch.</div><div class="t">sans · 15/1.6 · 400</div></div>
<div class="r"><div style="font-size:14px">Control and table label</div><div class="t">sans · 14 · 400/500</div></div>
<div class="r"><div style="font-size:13.5px;color:var(--muted-foreground)">Help text and secondary detail</div><div class="t">sans · 13.5/1.55 · muted</div></div>
<div class="r"><div style="font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground)">U01ABC — identifier</div><div class="t">mono · 13 · tabular</div></div>
<div class="r"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Eyebrow &amp; state label</div><div class="t">sans · 11 · 0.14em · 600</div></div>
</body></html>
