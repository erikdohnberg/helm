<!-- @dsCard group="Colors" viewport="700x180" name="Dark mode" subtitle="Designed, not inverted: opaque borders, lightness steps, a top highlight" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:0;height:180px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr}.pane{padding:22px;display:flex;flex-direction:column;gap:10px}.card{border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="pane" style="background:var(--background)"><div class="k">Light</div>
<div class="card" style="box-shadow:var(--e1)"><div style="font-family:var(--font-serif);font-size:17px">Surface on background</div>
<div style="font-size:13.5px;color:var(--muted-foreground)">Muted foreground · 7.1:1</div>
<div style="background:var(--sunken);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--muted-foreground)">Sunken — replaces muted / secondary / accent</div></div></div>
<div class="pane dark" style="background:var(--background)"><div class="k">Dark</div>
<div class="card" style="box-shadow:var(--e1)"><div style="font-family:var(--font-serif);font-size:17px">Surface reads by lightness step</div>
<div style="font-size:13.5px;color:var(--muted-foreground)">Muted foreground · 6.8:1</div>
<div style="background:var(--sunken);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--muted-foreground)">Sunken is <em>darker</em>; borders are opaque</div></div></div>
</body></html>
