<!-- @dsCard group="Space" viewport="700x170" name="Density" subtitle="Editorial by default; compact for settings tables alone" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:20px;height:170px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{border:1px solid var(--border);border-radius:var(--radius-log);padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px}.m{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground);line-height:1.85}</style></head><body>
<div class="c"><div class="k">Editorial · default</div><div class="m">row 48px<br>card pad 28px<br>field gap 20px<br>section gap 72px<br>control h 40px</div></div>
<div class="c"><div class="k">Compact · settings</div><div class="m">row 40px<br>card pad 18px<br>field gap 14px<br>section gap 40px<br>control h 34px</div></div>
<div class="c"><div class="k">Radii</div><div style="display:flex;align-items:flex-end;gap:8px">
<span style="width:30px;height:30px;border:1px solid var(--border-strong);border-radius:2px"></span>
<span style="width:30px;height:30px;border:1px solid var(--border-strong);border-radius:4px"></span>
<span style="width:30px;height:30px;border:1px solid var(--border-strong);border-radius:8px"></span>
<span style="width:30px;height:30px;border:1px solid var(--border-strong);border-radius:999px"></span></div>
<div class="m">2 log · 4 inner · 8 app · full</div></div>
<div class="c"><div class="k">Measure</div><div class="m">prose 68ch<br>help text 60ch<br>page 1080px<br>rail 104px</div></div>
</body></html>
