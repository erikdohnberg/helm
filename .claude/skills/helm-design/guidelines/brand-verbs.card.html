<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:24px;height:200px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;align-content:center}.r{display:grid;grid-template-columns:92px 1fr;gap:14px;font-size:14px}.r b{font-weight:600}.r span{color:var(--muted-foreground)}</style></head><body>
<div class="r"><b>Anchor</b><span>make official for a quarter</span></div>
<div class="r"><b>Add</b><span>enter alongside — nothing stops</span></div>
<div class="r"><b>Attach</b><span>join work to an outcome, adding nothing</span></div>
<div class="r"><b>Retire</b><span>end without a successor</span></div>
<div class="r"><b>Replace</b><span>trade one anchored outcome for another</span></div>
<div class="r"><b>Record</b><span>write a decision and its reasoning down</span></div>
</body></html>
