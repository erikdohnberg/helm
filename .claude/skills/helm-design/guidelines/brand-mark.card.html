<!-- @dsCard group="Brand" viewport="700x190" name="The mark" subtitle="A ship's wheel that is also a target — who is steering, and toward what" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{display:grid;grid-template-columns:repeat(4,1fr);height:190px}.c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-right:1px solid var(--border)}.cap{font-size:12px;color:var(--muted-foreground);text-align:center;padding:0 12px}</style></head><body>
<div class="c"><img src="../assets/helm-logo.svg" width="64" height="64" alt="Helm"><div class="cap">On paper · full ink</div></div>
<div class="c" style="background:var(--navy)"><img src="../assets/helm-logo.svg" width="64" height="64" alt="Helm" style="filter:brightness(0) invert(1)"><div class="cap" style="color:oklch(0.82 0.015 85)">On navy · reversed</div></div>
<div class="c"><div style="display:flex;align-items:center;gap:10px"><img src="../assets/helm-logo.svg" width="26" height="26" alt=""><span style="font-family:var(--font-serif);font-size:22px;font-weight:600;letter-spacing:.01em">Helm</span></div><div class="cap">Lockup · mark at cap height, 0.4em gap</div></div>
<div class="c" style="background:var(--sunken);border-right:none"><img src="../assets/helm-logo.svg" width="20" height="20" alt=""><div class="cap">Minimum 20px. Below that the ring closes — use the wordmark alone.</div></div>
</body></html>
