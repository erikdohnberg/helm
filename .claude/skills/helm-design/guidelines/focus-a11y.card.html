<!-- @dsCard group="Space" viewport="700x180" name="Focus & accessibility" subtitle="A 2px verdigris ring at 2px offset, on every surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:var(--text-body);line-height:var(--leading-body)}
a{color:var(--foreground)}a:hover{color:var(--sea)}
.k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
body{padding:22px;height:180px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.btn{font:inherit;font-size:14px;font-weight:500;height:40px;padding:0 18px;border-radius:var(--radius);outline:2px solid var(--ring);outline-offset:2px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c{border:1px solid var(--border);border-radius:var(--radius-log);padding:12px 14px;font-size:12.5px;color:var(--muted-foreground);background:var(--card)}.c b{color:var(--foreground);display:block;margin-bottom:4px}</style></head><body>
<div class="row">
<button class="btn" style="border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground)">Focused primary</button>
<button class="btn" style="border:1px solid var(--border-strong);background:var(--card);color:var(--foreground)">Focused outline</button>
<input class="btn" style="border:1px solid var(--foreground);background:var(--card);color:var(--foreground);min-width:190px;padding:0 14px" value="Focused field" readonly>
</div>
<div class="g">
<div class="c"><b>Contrast</b>Body ≥ 7:1, secondary ≥ 4.6:1, non-text ≥ 3:1 in both modes.</div>
<div class="c"><b>Targets</b>44×44 minimum, achieved with padding — glyphs stay 20px.</div>
<div class="c"><b>Never colour alone</b>Drift pairs brass with a diamond, a rule weight and a sentence.</div>
</div>
</body></html>
