name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: file:./prisma/ci.db
      # auth.ts only falls back to a dev secret when NODE_ENV is development, and the
      # e2e server runs as production — so an unset AUTH_SECRET makes NextAuth throw
      # MissingSecret and /api/auth/session 500s. The repo secret is optional here:
      # nothing in the suite signs in, so a fixed CI placeholder is enough.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-placeholder-secret-not-used-outside-ci' }}
      AUTH_GOOGLE_ID: 123456789-ci.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: GOCSPX-ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx prisma migrate deploy

      - run: npx prisma generate

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
